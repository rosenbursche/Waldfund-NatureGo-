<title>Wildfund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Lexend:wght@400;500;600&family=Special+Elite&display=swap">
<style>
/* Layout: eine Spalte, Handy-Breite (max 480px). Kreide-Leuchtgrün auf Waldnacht, Lehrbuch-Papier für Wissensseiten. Bewusst nur dunkles Design. */
:root{
  --bg:#03100a; --bg2:#071a10; --line:#1d4a2c;
  --glow:#7dff9a; --chalk:#d4ffdc; --dim:#4f8f60; --mute:#8bb898;
  --paper:#efe6cf; --paper2:#e4d7b7; --ink:#3a2a1c;
  --r1:#9fe3ae; --r2:#66d1ff; --r3:#c79bff; --r4:#ffcc55; --warn:#ff7a5c;
  --hand:"Kalam","Comic Sans MS",cursive;
  --body:"Lexend",system-ui,sans-serif;
  --type:"Special Elite","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(ellipse at 50% 30%,#0b2817 0,var(--bg) 70%);background-attachment:fixed}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px dashed var(--glow);outline-offset:3px}
.app{max-width:480px;margin:0 auto;padding:0 16px 40px;position:relative}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding-block:10px;background:linear-gradient(var(--bg) 70%,transparent)}
.lv{display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--glow);border-radius:50%;
  font-family:var(--hand);font-weight:700;font-size:18px;color:var(--glow);box-shadow:0 0 10px #3f0a,inset 0 0 8px #3f05;flex:none}
.hudmid{flex:1;min-width:0}
.hudmid .rank{font-family:var(--hand);font-size:17px;line-height:1.1;color:var(--chalk)}
.bar{height:6px;border-radius:3px;background:#123321;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--glow);box-shadow:0 0 8px var(--glow);transition:width .8s}
.hudmid small{font-family:var(--type);font-size:11px;color:var(--mute)}
.pts{text-align:right;flex:none}
.pts b{display:block;font-family:var(--type);font-size:19px;color:var(--glow);font-variant-numeric:tabular-nums}
.pts small{font-size:11px;color:var(--mute)}

.view{animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}

/* Home map */
.mapwrap{position:relative;margin-top:4px}
.mapwrap svg{width:100%;height:auto;display:block;overflow:visible}
.chalkfx{filter:drop-shadow(0 0 2px #7dff9a99) drop-shadow(0 0 7px #3bff6a55)}
.scrib{font-family:var(--hand);fill:var(--glow);opacity:.55}
.badge{cursor:pointer}
.badge:focus{outline:none}
.badge:focus-visible .ring{stroke-dasharray:4 4}
.qmark{font-family:var(--hand);font-weight:700;fill:var(--glow);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65}}
.hint{text-align:center;font-family:var(--hand);color:var(--mute);margin:-6px 0 18px}

h2{font-family:var(--hand);font-weight:700;font-size:24px;line-height:1.15;margin:0;text-wrap:balance;color:var(--chalk)}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h small{font-family:var(--type);color:var(--mute);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ach{display:flex;align-items:center;gap:8px;padding:6px 11px 6px 8px;border:1.5px dashed var(--line);border-radius:20px;font-size:13px;color:var(--mute)}
.ach svg{width:18px;height:18px;flex:none}
.ach.on{border-style:solid;border-color:var(--glow);color:var(--chalk);box-shadow:0 0 10px #3f03}
.recent{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.recent button{flex:none;width:78px;background:none;border:0;padding:0;text-align:center;font-size:12px;color:var(--mute)}
.recent .ph{width:78px;height:78px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2) center/cover;display:grid;place-items:center;margin-bottom:4px}
.note{font-family:var(--type);font-size:11.5px;color:var(--dim);margin-top:18px;line-height:1.5}
.linkbtn{background:none;border:0;padding:0;color:var(--mute);text-decoration:underline;font-family:var(--type);font-size:11.5px}

/* Top bar for subviews */
.top{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.back{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg2);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
.top .t{flex:1;min-width:0}
.top .t small{display:block;font-family:var(--type);font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.prog{font-family:var(--type);color:var(--glow);font-size:14px;flex:none}

/* tree */
.tree svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.node text{font-family:var(--body);font-size:11.5px;fill:var(--chalk)}
.node:focus{outline:none}
.node:focus-visible circle.o{stroke-dasharray:3 3}

/* mystery */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.mcard{position:relative;text-align:left;background:var(--bg2);border:1.5px dashed currentColor;border-radius:14px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.mcard .qq{font-family:var(--hand);font-size:34px;line-height:1;font-weight:700}
.mcard .rl{font-family:var(--type);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.mcard p{margin:0;font-size:12.5px;color:var(--mute);line-height:1.4}
.mcard.got{border-style:solid;box-shadow:0 0 14px color-mix(in srgb,currentColor 25%,transparent)}
.mcard.got .nm{font-family:var(--hand);font-size:18px;color:var(--chalk);line-height:1.1}

/* detail */
.stage{position:relative;height:300px;margin:0 -16px;touch-action:pan-y}
.stage canvas{width:100%;height:100%;display:block}
.stage .lock{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:var(--hand);color:var(--mute);font-size:14px}
.dname{margin-top:-6px}
.dname h1{font-family:var(--hand);font-weight:700;font-size:34px;line-height:1.05;margin:0;color:var(--chalk);text-wrap:balance}
.dname .lat{font-family:var(--type);color:var(--mute);font-size:14px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12.5px;border:1.5px solid currentColor;line-height:1.3}
.pill.solid{background:currentColor}
.pill.solid span{color:var(--bg)}
.dchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cta{margin-top:18px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border-radius:16px;border:2px solid var(--glow);
  background:#0f3a20;color:var(--chalk);font-weight:600;font-size:16px;box-shadow:0 0 18px #3f04,inset 0 0 12px #3f03}
.cta svg{width:22px;height:22px}
.cta:active{transform:scale(.98)}
.got{display:flex;gap:12px;align-items:center;margin-top:18px;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg2)}
.got .ph{width:64px;height:64px;border-radius:10px;background:#0d2a19 center/cover;flex:none;display:grid;place-items:center}
.got b{font-family:var(--hand);font-size:19px;color:var(--glow);font-weight:700}
.got small{display:block;color:var(--mute);font-size:12.5px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.facts dt{font-family:var(--type);color:var(--mute);font-size:12px;padding-top:2px}
dl.facts dd{margin:0;min-width:0}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:14px 14px 10px;margin:0 -4px;
  box-shadow:0 10px 30px #0008;position:relative;
  background-image:radial-gradient(#0000 60%,#8a6a3a18),repeating-linear-gradient(0deg,#0000 0 27px,#9ab7c81c 27px 28px)}
.paper h3{font-family:var(--hand);font-weight:700;font-size:20px;margin:0 0 2px;color:var(--ink)}
.paper .fig{font-family:var(--type);font-size:11.5px;color:#6b5640}
.paper canvas{width:100%;height:auto;display:block;margin-top:4px}
.paper.locked{filter:grayscale(.6) brightness(.55);text-align:center;padding:40px 14px}
.mapcard canvas{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.box{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--bg2)}
.box p{margin:0}
.box.warn{border-color:var(--warn);color:#ffd9cf}
.box.warn b{color:var(--warn)}
.riddle{font-family:var(--hand);font-size:21px;line-height:1.3;color:var(--chalk)}
.status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.status .box b{display:block;font-family:var(--hand);font-size:19px;font-weight:700;line-height:1.1}
.status .box small{color:var(--mute);font-size:12px;display:block;margin-top:4px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:#010805e8;display:grid;place-items:center;padding:20px 16px}
.mbox{width:100%;max-width:400px;text-align:center}
.shot{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:18px;overflow:hidden;border:2px solid var(--glow);background:#0d2a19 center/cover;box-shadow:0 0 30px #3f04}
.scan{position:absolute;left:0;right:0;height:3px;background:var(--glow);box-shadow:0 0 16px 4px var(--glow);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:6%}to{top:92%}}
.ticks{font-family:var(--type);font-size:13px;color:var(--mute);margin-top:14px;min-height:60px;line-height:1.7}
.win h2{font-size:30px}
.burst{width:190px;height:190px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;position:relative}
.burst::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px dashed currentColor;animation:spin 9s linear infinite;box-shadow:0 0 30px currentColor}
@keyframes spin{to{transform:rotate(360deg)}}
.burst .ph{width:150px;height:150px;border-radius:50%;background:#0d2a19 center/cover}
.plus{font-family:var(--type);font-size:30px;color:var(--glow);margin:6px 0}
.mbtn{margin-top:16px;width:100%;padding:14px;border-radius:14px;border:2px solid var(--glow);background:#0f3a20;font-weight:600}
.mbtn.ghost{border-color:var(--line);background:none;color:var(--mute);margin-top:8px}
.demo{font-family:var(--type);font-size:11px;color:var(--dim);margin-top:12px}
</style>

<div class="app" id="app">
  <header class="hud" aria-label="Fortschritt">
    <div class="lv" id="hudLv">1</div>
    <div class="hudmid"><div class="rank" id="hudRank">Entdecker</div><div class="bar"><i id="hudBar" style="width:0"></i></div><small id="hudNext"></small></div>
    <div class="pts"><b id="hudPts">0</b><small id="hudStreak">AP</small></div>
  </header>
  <main id="view"></main>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div class="modal" id="modal" hidden></div>

function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function hash(a,b,s){let h=(a*374761393+b*668265263+s*2246822519)>>>0;h=(h^(h>>>13))*1274126177>>>0;return((h^(h>>>16))>>>0)/4294967295}
function seedOf(str){let h=0;for(const ch of str)h=(h*31+ch.charCodeAt(0))>>>0;return h%9973}
